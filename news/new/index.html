<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>Новости Решётки</title>
        <link rel="stylesheet" href="../../resources/style.css">
        <link rel="icon" href="../../resources/images/favicon.ico">
    </head>
    <body>
        <a href="../../index.html"><div class="logo">
            <img src="../../resources/images/logo.png" width="100px" alt="">
            <h1>Lattice</h1>
        </div></a>
        <h1>Тех поддержка</h1>
        <hr>
        <button id="support-btn" style="position: fixed; bottom: 20px; right: 20px; background: #007bff; color: white; border: none; border-radius: 50px; padding: 12px 20px; cursor: pointer; font-family: sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 9999;">Поддержка</button>

<div id="support-modal" style="display: none; position: fixed; bottom: 80px; right: 20px; width: 300px; background: white; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); font-family: sans-serif; overflow: hidden; z-index: 9999;">
  <div style="background: #007bff; color: white; padding: 10px 15px; font-weight: bold; display: flex; justify-content: space-between;">
    <span>/span>
    <span id="support-close" style="cursor: pointer;">&times;</span>
  </div>
  <form id="support-form" style="padding: 15px;">
    <input type="text" id="support-name" placeholder="Ваше имя" required style="width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
    <input type="email" id="support-email" placeholder="Email для ответа" required style="width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
    <textarea id="support-msg" placeholder="Опишите вашу проблему..." rows="4" required style="width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;"></textarea>
    <button type="submit" style="width: 100%; background: #007bff; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer;">Отправить</button>
  </form>
</div>
