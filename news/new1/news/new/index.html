        html<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой Веб-Анонимайзер</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .search-container {
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        input[type="url"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        iframe {
            width: 100%;
            height: 70vh;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
        }
    </style>
</head>
<body>

    <h2>Простой Веб-Прокси</h2>
    <p>Введите адрес сайта (обязательно с http:// или https://) и нажмите «Открыть»</p>

    <div class="search-container">
        <input type="url" id="urlInput" placeholder="https://example.com" value="https://example.com">
        <button onclick="openSite()">Открыть</button>
    </div>

    <!-- Окно, в котором будет отображаться открытый сайт -->
    <iframe id="proxyFrame" name="proxyFrame"></iframe>

    <script>
        function openSite() {
            const url = document.getElementById('urlInput').value;
            const iframe = document.getElementById('proxyFrame');
            
            if (!url) {
                alert('Пожалуйста, введите URL-адрес');
                return;
            }

            // Используем бесплатный публичный CORS-прокси (allorigins)
            // Он помогает обойти запреты на отображение сайтов в iframe
            const proxyUrl = 'https://allorigins.win' + encodeURIComponent(url);
            
            // Загружаем сайт через прокси в наше окно
            iframe.src = proxyUrl;
        }
    </script>

</body>
</html>
        <hr>
        <small>Использование моего контента без разрешения в своих видео строго запрещено</small>
    </body>
</html>
